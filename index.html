
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>TRENZO</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <link rel="stylesheet" href="styles/main.css?v=16">
</head>

<body>

  <!-- ЭКРАН 1: ПРИВЕТСТВИЕ -->

  <section class="screen active" id="welcomeScreen">
    <div class="welcome">

      <img src="welcome.png" alt="TRENZO">

      <button
        class="start-button-area"
        onclick="openRoles()"
        aria-label="Начать"
      ></button>

    </div>
  </section>

  <!-- ЗАГРУЗКА ПРИ ВХОДЕ -->

  <div
    id="authLoading"
    class="auth-loading"
    role="status"
    aria-live="polite"
    hidden
  >

    <div class="auth-loading-content">

      <div class="auth-spinner"></div>

      <div class="auth-loading-title">
        Подключаем TRENZO
      </div>

      <div class="auth-loading-text">
        Проверяем вход через Telegram...
      </div>

      <div class="auth-loading-hint">
        Это может занять несколько секунд
      </div>

    </div>

  </div>

  <!-- ЭКРАН 2: ВЫБОР РОЛИ -->

  <section class="screen" id="roleScreen">

    <div class="page role-screen-page">

      <div class="topbar role-screen-topbar">
        <div class="logo">TREN<span>ZO</span></div>
        <button
          class="back-button"
          onclick="showScreen('welcomeScreen')"
          aria-label="Назад"
        >←</button>
      </div>

      <h1>Выбери свою роль</h1>

      <p class="hint">
        Это поможет настроить TRENZO<br>под твои задачи.
      </p>

      <div class="role-options">

        <button
          class="role-card"
          onclick="selectRole('trainer')"
        >
          <span class="role-icon">

            <svg viewBox="0 0 24 24">
              <circle cx="9" cy="7" r="4"/>
              <path d="M2 21v-2a7 7 0 0 1 14 0v2"/>
              <path d="M17 4a4 4 0 0 1 0 8"/>
              <path d="M19 15a5 5 0 0 1 3 5v1"/>
            </svg>

          </span>

          <span class="role-info">
            <strong>Тренер</strong>
            <small>
              Веду клиентов<br class="role-copy-break">и отслеживаю их прогресс
            </small>
          </span>

          <span class="role-arrow">›</span>
        </button>


        <button
          class="role-card"
          onclick="selectRole('athlete')"
        >
          <span class="role-icon">

            <svg viewBox="0 0 24 24">
              <path d="M3 17l6-6 4 4 8-8"/>
              <path d="M15 7h6v6"/>
            </svg>

          </span>

          <span class="role-info">
            <strong>Спортсмен</strong>
            <small>
              Тренируюсь<br class="role-copy-break">и отслеживаю свой прогресс
            </small>
          </span>

          <span class="role-arrow">›</span>
        </button>

      </div>

    </div>
  </section>


  <!-- ЛИЧНАЯ АНКЕТА.
       Содержимое добавляет athlete.js -->

  <section class="screen" id="athleteScreen"></section>


  <!-- АНКЕТА ТРЕНЕРА.
       Содержимое добавляет trainer.js -->

  <section class="screen" id="trainerScreen"></section>


  <!-- ПОДКЛЮЧАЕМ ЛОГИКУ И ЭКРАНЫ -->

  <script src="app.js?v=7"></script>
  <script src="screens/athlete.js?v=10"></script>
  <script src="screens/trainer.js?v=7"></script>

</body>
</html>
