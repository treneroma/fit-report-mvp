<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fit Report</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    .app {
      max-width: 500px;
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 8px;
    }

    p {
      color: #666;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-top: 20px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="app">
    <h1>Fit Report</h1>
    <p>Твой персональный тренировочный помощник</p>

    <div class="card">
      <h2>Добро пожаловать 👋</h2>
      <p>
        Здесь будут тренировки, питание и отслеживание прогресса.
      </p>

      <button onclick="startApp()">
        Начать
      </button>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();

    function startApp() {
      tg.showAlert("Приложение работает!");
    }
  </script>

</body>
</html>
