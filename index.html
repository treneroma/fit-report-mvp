<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TRENZO</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #111;
      font-family: Arial, sans-serif;
    }

    .screen {
      display: none;
      min-height: 100dvh;
    }

    .screen.active {
      display: block;
    }

    .welcome {
      position: relative;
      width: 100%;
      min-height: 100dvh;
      background: #111;
      overflow: hidden;
    }

    .welcome img {
      display: block;
      width: 100%;
      height: auto;
    }

    .start-button-area {
      position: absolute;
      left: 6%;
      top: 81%;
      width: 88%;
      height: 7%;
      background: transparent;
      border: none;
      cursor: pointer;
    }

    .profile {
      min-height: 100dvh;
      background: #111;
      color: white;
      padding: 24px 18px;
    }

    .logo {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 24px;
    }

    .question {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .hint {
      color: #aaa;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    input {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      border: 1px solid #333;
      background: #1d1d1d;
      color: white;
      font-size: 16px;
      outline: none;
    }

    .continue-btn {
      width: 100%;
      margin-top: 18px;
      padding: 16px;
      border: none;
      border-radius: 14px;
      background: #ff7a3d;
      color: black;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Экран 1 -->
  <section class="screen active" id="welcomeScreen">
    <div class="welcome">
      <img src="welcome.png" alt="TRENZO">
      <button class="start-button-area" onclick="openProfile()" aria-label="Начать"></button>
    </div>
  </section>

  <!-- Экран 2 -->
  <section class="screen profile" id="profileScreen">
    <div class="logo">TRENZO</div>
    <div class="question">Как тебя зовут?</div>
    <div class="hint">Давай познакомимся. Как к тебе обращаться?</div>
    <input id="nameInput" type="text" placeholder="Твоё имя">
    <button class="continue-btn" onclick="saveName()">Продолжить</button>
  </section>

  <script>
    const tg = window.Telegram?.WebApp;

    if (tg) {
      tg.ready();
      tg.expand();
    }

    function openProfile() {
      document.getElementById('welcomeScreen').classList.remove('active');
      document.getElementById('profileScreen').classList.add('active');
      window.scrollTo(0, 0);
    }

    function saveName() {
      const name = document.getElementById('nameInput').value.trim();

      if (!name) {
        if (tg) tg.showAlert('Введите имя');
        else alert('Введите имя');
        return;
      }

      if (tg) tg.showAlert('Отлично, ' + name + '!');
      else alert('Отлично, ' + name + '!');
    }
  </script>

</body>
</html>
