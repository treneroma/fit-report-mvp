<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TRENZO · Подключение FatSecret</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #1c1c1c;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 32px 24px;
      background: #292929;
      border: 1px solid #414141;
      border-radius: 24px;
      text-align: center;
    }

    .logo {
      margin-bottom: 28px;
      font-size: 36px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .logo span {
      color: #ff7846;
    }

    .icon {
      margin-bottom: 16px;
      color: #ff7846;
      font-size: 48px;
      font-weight: 700;
    }

    h1 {
      margin: 0 0 14px;
      font-size: 24px;
      line-height: 1.3;
    }

    p {
      margin: 0;
      color: #aaa;
      font-size: 16px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="logo">TREN<span>ZO</span></div>

    <div class="icon" id="resultIcon">✓</div>

    <h1 id="resultTitle">FatSecret подключён!</h1>

    <p id="resultText">
      Твой аккаунт успешно подключён.
      Можешь вернуться в Telegram и продолжить работу в TRENZO.
    </p>
  </main>

  <script>
    const status = new URLSearchParams(location.search).get("status");

    if (status !== "success") {
      document.getElementById("resultIcon").textContent = "!";

      document.getElementById("resultTitle").textContent =
        "Не удалось подключить FatSecret";

      document.getElementById("resultText").textContent =
        "Вернись в TRENZO и попробуй подключить аккаунт ещё раз.";
    }
  </script>
</body>
</html>
